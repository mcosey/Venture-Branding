<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Venture Branding</title>
<link rel="icon" type="image/png" href="images/09.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Work Sans",system-ui,sans-serif;
    background:#0D151F;color:#fff;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:24px;text-align:center;
  }
  .wrap{max-width:460px}
  img{height:32px;width:auto;margin-bottom:34px}
  .code{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#7d8794;margin-bottom:14px}
  h1{font-size:26px;font-weight:600;line-height:1.25;margin-bottom:14px}
  h1 em{font-style:normal;color:#C94D5B}
  p{color:#aeb6c1;font-size:15px;line-height:1.6;margin-bottom:28px}
  a.btn{
    display:inline-block;font-size:14px;font-weight:600;
    color:#fff;background:#C94D5B;border-radius:8px;
    padding:11px 20px;text-decoration:none;transition:filter .15s;
  }
  a.btn:hover{filter:brightness(1.08)}
  a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main class="wrap">
    <img src="images/02.png" alt="Venture Branding">
    <p class="code">404 — Not found</p>
    <h1>That page isn't <em>here</em>.</h1>
    <p>The version or page you're looking for doesn't exist. Head back to the design versions to keep looking.</p>
    <a class="btn" href="/">Back to versions</a>
  </main>
</body>
</html>
