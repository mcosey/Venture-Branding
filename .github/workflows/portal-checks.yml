name: Portal offline regression checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked parser dependency without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix supabase/functions/uspto-lookup
      - name: Verify reviewed diagnostic bundles match their sources
        run: node tools/check-diagnostics-artifacts.mjs
      - name: Run portal tests with network tripwire
        env:
          NODE_OPTIONS: --import ./tools/no-network.mjs
        run: node --test tools/*.test.mjs tools/*.test.cjs
      - name: Run existing Watch runner tests with sockets blocked
        run: python3 tools/run-watch-tests.py
      - name: Check patch whitespace
        run: git diff --check
