<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Client sign in — Venture Branding</title><link rel="icon" href="images/09.png"><link rel="stylesheet" href="auth/auth.css"><script src="auth/config.js" defer></script><script src="auth/vendor/supabase.js" defer></script><script type="module" src="auth/auth.js"></script><script type="module" src="shared/control-spacing.js?v=20261010"></script></head>
<body data-audience="client"><main><a class="brand" href="v8.html"><img src="images/02.png" alt="Venture Branding home"></a><div class="card"><span class="eyebrow">Client portal</span><h1 id="heading">Client sign in</h1><p id="intro">Access is by invitation from Venture Branding.</p>
<form id="signin"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><button class="text-button" id="forgot" type="button">Forgot password?</button></form>
<form id="recovery" hidden><label for="recovery-email">Email address</label><input id="recovery-email" name="email" type="email" autocomplete="email" required maxlength="254"><button type="submit">Send reset link</button><button class="text-button" type="button" data-back>Back to sign in</button></form>
<form id="set-password" hidden><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Save password</button></form>
<section id="mfa" hidden><p id="mfa-instructions">Enter the code from your authenticator app.</p><button id="enroll" type="button" hidden>Set up authenticator</button><img id="qr" alt="Authenticator setup QR code" hidden><p id="setup-key" hidden></p><form id="verify" hidden><label for="factor">Authenticator</label><select id="factor"></select><label for="code">Six-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Verify</button></form></section>
<section id="signed-in" hidden><p>Your identity is verified. Connecting the portal is the next setup step.</p></section><button id="signout" type="button" class="text-button" hidden>Sign out</button><p id="message" role="status" aria-live="polite"></p></div><a class="footer" href="v8.html">← Back to website</a></main></body></html>
