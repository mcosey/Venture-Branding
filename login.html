<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Sign in — Venture Branding Law Portal</title><link rel="icon" href="images/09.png"><link rel="stylesheet" href="auth/auth.css"><script src="auth/config.js" defer></script><script src="auth/vendor/supabase.js" defer></script><script type="module" src="auth/auth.js?v=member-entry-1"></script><script type="module" src="shared/control-spacing.js?v=20261010"></script><style>.signup-prompt{margin-top:24px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px}.signup-button{display:block;text-decoration:none;border-radius:8px;padding:12px 20px;font-weight:600;margin-top:12px;background:transparent;color:var(--coral);border:1px solid var(--coral)}.signup-button:hover{background:#ed919710}.signup-prompt p{margin:12px 0 0;font-size:14px}</style></head>
<body data-audience="client"><main><a class="brand" href="v8.html"><img src="images/02.png" alt="Venture Branding home"></a><div class="card"><span class="eyebrow">Venture Branding Law Portal</span><h1 id="heading">Sign in</h1><p id="intro">Welcome back. Sign in to your account.</p>
<form id="signin"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><button class="text-button" id="forgot" type="button">Forgot password?</button><div class="signup-prompt"><span>New to Venture Branding?</span><a class="signup-button" href="signup.html">Sign up</a></div></form>
<form id="recovery" hidden><label for="recovery-email">Email address</label><input id="recovery-email" name="email" type="email" autocomplete="email" required maxlength="254"><button type="submit">Send reset link</button><button class="text-button" type="button" data-back>Back to sign in</button></form>
<form id="set-password" hidden><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Save password</button></form>
<section id="mfa" hidden><p id="mfa-instructions">Enter the code from your authenticator app.</p><button id="enroll" type="button" hidden>Set up authenticator</button><img id="qr" alt="Authenticator setup QR code" hidden><p id="setup-key" hidden></p><form id="verify" hidden><label for="factor">Authenticator</label><select id="factor"></select><label for="code">Six-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Verify</button></form></section>
<section id="signed-in" hidden><p>Your identity is verified. Connecting the portal is the next setup step.</p></section><button id="signout" type="button" class="text-button" hidden>Sign out</button><p id="message" role="status" aria-live="polite"></p></div><a class="footer" href="v8.html">← Back to Venture Branding Law</a></main></body></html>
