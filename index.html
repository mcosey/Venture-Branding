<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venture Branding — Design Versions</title>
<link rel="icon" type="image/png" href="images/09.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bar-h:52px;
    --navy:#0D151F;
    --coral:#C94D5B;
    --coral-bright:#D44D5C;
    --line:rgba(255,255,255,.12);
    --panel:#111b27;
  }
  html,body{height:100%}
  body{font-family:"Work Sans",system-ui,sans-serif;background:var(--navy);overflow:hidden}

  .switcher{
    position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:0 14px;
    background:rgba(10,16,24,.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;align-items:center;gap:10px;flex:none;
    color:#fff;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  }
  .brand img{height:22px;width:auto;display:block}
  .brand .tag{color:#7d8794;font-weight:500;letter-spacing:.02em;text-transform:none}

  /* ---- picker cluster: [‹] trigger [›] ---- */
  .cluster{display:flex;align-items:center;gap:6px;flex:none}

  .step{
    width:32px;height:32px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font:inherit;font-size:16px;line-height:1;
    color:#cdd4de;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:8px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .step:hover{color:#fff;background:rgba(255,255,255,.11)}
  .step:active{transform:translateY(1px)}

  .trigger{
    display:flex;align-items:center;gap:9px;
    height:32px;padding:0 11px;
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.01em;
    color:#fff;background:var(--coral);border:1px solid var(--coral);border-radius:8px;
    cursor:pointer;transition:background .15s,filter .15s;
  }
  .trigger:hover{filter:brightness(1.07)}
  /* number-only by default; the descriptive name appears when there's room */
  .trigger .tname{display:none;font-weight:500;opacity:.92;font-size:13px;
    padding-left:9px;border-left:1px solid rgba(255,255,255,.28)}
  .trigger .caret{font-size:10px;opacity:.85;transition:transform .18s}
  .trigger[aria-expanded="true"] .caret{transform:rotate(180deg)}
  @media(min-width:720px){ .trigger .tname{display:inline} }

  .spacer{flex:1}
  .count{color:#7d8794;font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .hint{color:#6b7480;font-size:12px;flex:none}

  :focus-visible{outline:2px solid #fff;outline-offset:2px}
  .trigger:focus-visible{outline-offset:3px}

  /* ---- popover picker ---- */
  .backdrop{position:fixed;inset:0;z-index:15;display:none}
  .backdrop.open{display:block}

  .picker{
    position:fixed;top:calc(var(--bar-h) + 6px);left:14px;z-index:30;
    width:min(320px,calc(100vw - 28px));
    background:var(--panel);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    display:none;flex-direction:column;overflow:hidden;
  }
  .picker.open{display:flex;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .search-wrap{position:relative;padding:10px;border-bottom:1px solid var(--line)}
  .search-wrap .icn{
    position:absolute;left:20px;top:50%;transform:translateY(-50%);
    color:#6b7480;font-size:13px;pointer-events:none;
  }
  .search{
    width:100%;height:34px;padding:0 10px 0 30px;
    font:inherit;font-size:14px;color:#fff;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;
  }
  .search::placeholder{color:#6b7480}
  .search:focus{outline:none;border-color:var(--coral)}

  .list{list-style:none;max-height:min(60vh,420px);overflow-y:auto;padding:6px;margin:0}
  .opt{
    display:flex;align-items:baseline;gap:10px;
    padding:9px 12px;border-radius:8px;cursor:pointer;
    color:#cdd4de;scroll-margin:6px;
  }
  .opt .onum{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;min-width:34px;color:#fff}
  .opt .oname{font-size:14px;font-weight:400;color:#aeb6c1}
  .opt .odot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--coral);opacity:0;flex:none;align-self:center}
  .opt:hover,.opt.cursor{background:rgba(255,255,255,.08)}
  .opt.cursor .oname{color:#fff}
  .opt.active{background:rgba(201,77,91,.16)}
  .opt.active .oname{color:#fff}
  .opt.active .odot{opacity:1}
  .empty{padding:18px 14px;color:#6b7480;font-size:13px;text-align:center}

  .stage{position:fixed;inset:var(--bar-h) 0 0 0;background:#fff}
  .stage iframe{width:100%;height:100%;border:0;display:block}

  @media(max-width:560px){
    .brand .tag,.hint{display:none}
    .picker{left:8px;right:8px;width:auto}
  }
  @media (prefers-reduced-motion: reduce){
    .picker.open{animation:none}
    .trigger .caret{transition:none}
    .step,.trigger{transition:none}
  }
</style>
</head>
<body>

<nav class="switcher" aria-label="Design version switcher">
  <span class="brand">
    <img src="images/02.png" alt="Venture Branding">
    <span class="tag">design versions</span>
  </span>

  <div class="cluster">
    <button class="step" id="prev" type="button" aria-label="Previous version (left arrow)" title="Previous (←)">&#8249;</button>
    <button class="trigger" id="trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker" aria-label="Choose design version">
      <span class="tid" id="tid">V2</span>
      <span class="tname" id="tname">Brutalist</span>
      <span class="caret" aria-hidden="true">&#9662;</span>
    </button>
    <button class="step" id="next" type="button" aria-label="Next version (right arrow)" title="Next (→)">&#8250;</button>
  </div>

  <span class="spacer"></span>
  <span class="count" id="count" aria-hidden="true"></span>
  <span class="hint">← / → to step · your choice sticks on refresh</span>
</nav>

<div class="backdrop" id="backdrop"></div>

<div class="picker" id="picker" role="dialog" aria-label="Version picker">
  <div class="search-wrap">
    <span class="icn" aria-hidden="true">&#9906;</span>
    <input class="search" id="search" type="text" placeholder="Search versions…" autocomplete="off"
           role="combobox" aria-controls="list" aria-expanded="true" aria-label="Search versions">
  </div>
  <ul class="list" id="list" role="listbox" aria-label="Design versions"></ul>
</div>

<div class="stage">
  <iframe id="frame" title="Selected design version"></iframe>
</div>

<script>
  /* Single source of truth — add a version here and the whole UI updates. */
  var VERSIONS = [
    {id:"v1",  name:"Registered"},
    {id:"v2",  name:"Brutalist"},
    {id:"v3",  name:"Boutique"},
    {id:"v6",  name:"Whimsical"},
    {id:"v7",  name:"Newspaper"},
    {id:"v8",  name:"Interactive"},
    {id:"v10", name:"The Filing"},
    {id:"v12", name:"Old Legal"},
    {id:"v16", name:"Terminal"},
    {id:"v19", name:"Specimen"},
    {id:"v21", name:"Ledger"},
    {id:"v23", name:"Traditional"}
  ];

  var DEFAULT = "v2";

  var frame   = document.getElementById("frame");
  var trigger = document.getElementById("trigger");
  var tidEl   = document.getElementById("tid");
  var tnameEl = document.getElementById("tname");
  var countEl = document.getElementById("count");
  var picker  = document.getElementById("picker");
  var backdrop= document.getElementById("backdrop");
  var search  = document.getElementById("search");
  var list    = document.getElementById("list");

  var current = DEFAULT;
  var cursor  = 0;          // highlighted index within the *filtered* list
  var filtered = VERSIONS.slice();

  function idxOf(id){
    for(var i=0;i<VERSIONS.length;i++){ if(VERSIONS[i].id===id) return i; }
    return -1;
  }
  function filteredIndexOf(id){
    for(var i=0;i<filtered.length;i++){ if(filtered[i].id===id) return i; }
    return 0;
  }

  /* ---- selection ---- */
  function pick(id){
    if(idxOf(id) === -1) id = DEFAULT;
    current = id;
    frame.src = id + ".html";
    var v = VERSIONS[idxOf(id)];
    tidEl.textContent = "V" + id.slice(1);
    tnameEl.textContent = v.name;
    countEl.textContent = (idxOf(id)+1) + " / " + VERSIONS.length;
    try{ localStorage.setItem("vb-version", id); }catch(e){}
    renderList();          // keep active marker in sync if open
  }

  function step(delta){
    var i = idxOf(current);
    i = (i + delta + VERSIONS.length) % VERSIONS.length;   // wrap around
    pick(VERSIONS[i].id);
  }

  /* ---- picker open/close ---- */
  function openPicker(){
    filtered = VERSIONS.slice();
    search.value = "";
    picker.classList.add("open");
    backdrop.classList.add("open");
    trigger.setAttribute("aria-expanded","true");
    // start cursor on the current version
    cursor = filteredIndexOf(current);
    renderList();
    setTimeout(function(){ search.focus(); scrollCursorIntoView(); }, 0);
    document.addEventListener("keydown", onKey, true);
  }
  function closePicker(returnFocus){
    picker.classList.remove("open");
    backdrop.classList.remove("open");
    trigger.setAttribute("aria-expanded","false");
    document.removeEventListener("keydown", onKey, true);
    if(returnFocus !== false) trigger.focus();
  }
  function isOpen(){ return picker.classList.contains("open"); }

  /* ---- list rendering ---- */
  function renderList(){
    list.innerHTML = "";
    if(filtered.length === 0){
      var e = document.createElement("li");
      e.className = "empty"; e.textContent = "No versions match.";
      list.appendChild(e);
      return;
    }
    filtered.forEach(function(v, i){
      var li = document.createElement("li");
      li.className = "opt" + (v.id===current?" active":"") + (i===cursor?" cursor":"");
      li.setAttribute("role","option");
      li.setAttribute("aria-selected", v.id===current ? "true":"false");
      li.dataset.id = v.id;
      li.innerHTML =
        '<span class="onum">V'+v.id.slice(1)+'</span>'+
        '<span class="oname"></span>'+
        '<span class="odot" aria-hidden="true"></span>';
      li.querySelector(".oname").textContent = v.name;   // textContent = XSS-safe
      li.addEventListener("click", function(){ pick(v.id); closePicker(); });
      li.addEventListener("mousemove", function(){ if(cursor!==i){ cursor=i; markCursor(); } });
      list.appendChild(li);
    });
  }
  function markCursor(){
    var opts = list.querySelectorAll(".opt");
    for(var i=0;i<opts.length;i++){ opts[i].classList.toggle("cursor", i===cursor); }
  }
  function scrollCursorIntoView(){
    var el = list.querySelectorAll(".opt")[cursor];
    if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
  }

  function applyFilter(){
    var q = search.value.trim().toLowerCase();
    filtered = VERSIONS.filter(function(v){
      return q==="" || v.name.toLowerCase().indexOf(q)!==-1 || ("v"+v.id.slice(1)).indexOf(q)!==-1 || v.id.indexOf(q)!==-1;
    });
    cursor = 0;
    renderList();
    scrollCursorIntoView();
  }

  /* ---- keyboard within picker ---- */
  function onKey(e){
    if(e.key === "Escape"){ e.preventDefault(); closePicker(); return; }
    if(e.key === "ArrowDown"){ e.preventDefault(); if(filtered.length){ cursor=(cursor+1)%filtered.length; markCursor(); scrollCursorIntoView(); } return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); if(filtered.length){ cursor=(cursor-1+filtered.length)%filtered.length; markCursor(); scrollCursorIntoView(); } return; }
    if(e.key === "Enter"){ e.preventDefault(); if(filtered[cursor]){ pick(filtered[cursor].id); closePicker(); } return; }
  }

  /* ---- wiring ---- */
  trigger.addEventListener("click", function(){ isOpen() ? closePicker() : openPicker(); });
  document.getElementById("prev").addEventListener("click", function(){ step(-1); });
  document.getElementById("next").addEventListener("click", function(){ step(1); });
  backdrop.addEventListener("click", function(){ closePicker(false); });
  search.addEventListener("input", applyFilter);

  /* global ← / → to step versions — but not while typing in the search box */
  document.addEventListener("keydown", function(e){
    if(isOpen()) return;                              // picker handles its own keys
    var t = e.target;
    if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA")) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  });

  /* boot */
  var saved;
  try{ saved = localStorage.getItem("vb-version"); }catch(e){}
  pick(saved || DEFAULT);
</script>

</body>
</html>
