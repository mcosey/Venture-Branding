<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venture Branding — Design Versions</title>
<link rel="icon" type="image/png" href="images/09.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bar-h:52px;
    --navy:#0D151F;
    --coral:#C94D5B;
  }
  html,body{height:100%}
  body{font-family:"Work Sans",system-ui,sans-serif;background:var(--navy);overflow:hidden}

  .switcher{
    position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:10;
    display:flex;align-items:center;gap:6px;
    padding:0 16px;
    background:rgba(10,16,24,.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .switcher .brand{
    display:flex;align-items:center;gap:10px;
    color:#fff;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    margin-right:8px;
  }
  .switcher .brand img{height:22px;width:auto;display:block}
  .switcher .brand .tag{color:#7d8794;font-weight:500;letter-spacing:.02em;text-transform:none}
  .switcher .tabs{display:flex;gap:4px}
  .tab{
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
    color:#aeb6c1;background:transparent;border:1px solid transparent;border-radius:7px;
    padding:7px 16px;cursor:pointer;transition:.15s;
  }
  .tab:hover{color:#fff;background:rgba(255,255,255,.07)}
  .tab.active{color:#fff;background:var(--coral);border-color:var(--coral)}
  .tab .sub{display:block;font-size:10px;font-weight:500;letter-spacing:.04em;opacity:.75;text-transform:uppercase;margin-top:1px}
  .switcher .spacer{flex:1}
  .switcher .hint{color:#6b7480;font-size:12px}
  :focus-visible{outline:2px solid #fff;outline-offset:2px}

  .stage{position:fixed;inset:var(--bar-h) 0 0 0;background:#fff}
  .stage iframe{width:100%;height:100%;border:0;display:block}

  @media(max-width:640px){
    .switcher .hint,.switcher .brand .tag{display:none}
    .tab{padding:7px 12px}
    .tab .sub{display:none}
  }
</style>
</head>
<body>

<nav class="switcher" aria-label="Design version switcher">
  <span class="brand">
    <img src="images/02.png" alt="Venture Branding">
    <span class="tag">design versions</span>
  </span>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-version="v1">V1<span class="sub">Registered</span></button>
    <button class="tab" role="tab" data-version="v2">V2<span class="sub">Brutalist</span></button>
    <button class="tab" role="tab" data-version="v3">V3<span class="sub">Boutique</span></button>
    <button class="tab" role="tab" data-version="v4">V4<span class="sub">Editorial</span></button>
    <button class="tab" role="tab" data-version="v5">V5<span class="sub">Minimal</span></button>
    <button class="tab" role="tab" data-version="v6">V6<span class="sub">Whimsical</span></button>
    <button class="tab" role="tab" data-version="v7">V7<span class="sub">Newspaper</span></button>
    <button class="tab" role="tab" data-version="v8">V8<span class="sub">Interactive</span></button>
    <button class="tab" role="tab" data-version="v9">V9<span class="sub">Uber</span></button>
    <button class="tab" role="tab" data-version="v10">V10<span class="sub">The Filing</span></button>
  </div>
  <span class="spacer"></span>
  <span class="hint">Pick a direction — your choice sticks on refresh</span>
</nav>

<div class="stage">
  <iframe id="frame" title="Selected design version"></iframe>
</div>

<script>
  var VERSIONS = ["v1","v2","v3","v4","v5","v6","v7","v8","v9","v10"];
  var DEFAULT = "v2";
  var frame = document.getElementById("frame");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function pick(v){
    if(VERSIONS.indexOf(v) === -1) v = DEFAULT;
    frame.src = v + ".html";
    tabs.forEach(function(t){
      var on = t.getAttribute("data-version") === v;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    try{ localStorage.setItem("vb-version", v); }catch(e){}
  }

  tabs.forEach(function(t){
    t.addEventListener("click", function(){ pick(t.getAttribute("data-version")); });
  });

  var saved;
  try{ saved = localStorage.getItem("vb-version"); }catch(e){}
  pick(saved || DEFAULT);
</script>

</body>
</html>
